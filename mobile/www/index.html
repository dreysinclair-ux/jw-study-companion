<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JW Study Companion</title>
<meta name="theme-color" content="#244d3e">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="A personal study companion with local notes, study plans and customization.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">✦</div><div><strong>JW Study</strong><small>COMPANION</small></div></div>
    <div class="side-label">WORKSPACE</div>
    <button class="nav active" data-page="dashboard">▦ <span>Dashboard</span></button>
    <button class="nav" data-page="studies">▤ <span>My studies</span></button>
    <button class="nav" data-page="planner">◷ <span>Study planner</span></button>
    <button class="nav" data-page="notes">✎ <span>Notes & research</span></button>
    <button class="nav" data-page="highlights">✧ <span>Highlights</span></button>
    <button class="nav" data-page="library">▣ <span>My library</span></button>
    <button class="nav" data-page="customize">✦ <span>Customization Studio</span></button>
    <div class="sidebar-bottom">
      <div class="source-card"><div class="source-dot"></div><div><b>JW.ORG source mode</b><small>Only approved religious source</small></div></div>
      <button class="nav" data-page="settings">⚙ <span>Settings</span></button>
      <div class="profile"><div class="avatar">S</div><div><b>Personal study</b><small>Saved on this device</small></div></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <b id="crumb">Dashboard</b></div><div class="top-actions"><span class="online-pill"><i></i> Online + offline support</span><button class="icon-btn" id="quickAdd" title="Add a note">＋</button></div></header>
    <section class="content" id="view"></section>
    <footer>Personal study tool · Official religious information must be verified on <button class="text-link" id="jwFooter">JW.ORG</button></footer>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="mobile.js"></script>
</body></html>
