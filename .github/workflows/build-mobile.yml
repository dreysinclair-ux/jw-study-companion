name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Build mobile web bundle
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app to Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JW-Study-Companion-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: Build iPhone Simulator App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Build mobile web bundle
        run: npm run build
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync web app to iOS
        run: npx cap sync ios
      - name: Build iOS Simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r JW-Study-Companion-iOS-Simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: JW-Study-Companion-iOS-Simulator
          path: mobile/build/Build/Products/Debug-iphonesimulator/JW-Study-Companion-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
